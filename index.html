<style>
:root{color-scheme:dark;--bg:#15121c;--panel:#211b2b;--panel2:#2b2337;--text:#f4edf9;--muted:#b9a9c9;--accent:#d28bff;--line:#493858}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#30213e,var(--bg) 50%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1050px;margin:auto;padding:16px}header{padding:10px 4px 18px}h1{letter-spacing:.12em;margin:0;font-size:1.8rem}header p{color:var(--muted);margin:.4em 0}.panel{background:linear-gradient(160deg,var(--panel),#1b1723);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}
h2{font-size:1.05rem;margin:0 0 12px;color:#e6c7ff}label{display:block;font-size:.9rem;color:var(--muted);margin:8px 0 5px}
textarea,input,select{width:100%;background:#120f18;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit}textarea{min-height:76px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px;font:inherit;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:linear-gradient(120deg,#7b3fa1,#b05ed4);border-color:#ca86ef;font-weight:700}button.subtle{background:#181420}button.danger{border-color:#75465b}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px}.result{min-height:210px;white-space:pre-wrap;line-height:1.55;word-break:break-word}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}
small,.note,.stats{color:var(--muted);font-size:.85rem}.character-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
details{margin-top:10px}summary{cursor:pointer;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:8px}.checkrow input{width:auto}
footer{padding:20px 4px;color:var(--muted);font-size:.8rem}
</style></head><body><main>
<header><h1>ORACLE</h1><p>RANDOM CHARACTER SCENE · CHARACTER LIBRARY</p></header>
<section class="panel"><h2>キャラクター登録</h2>
<div class="grid"><div><label>キャラクター名</label><input id="charName" placeholder="名前 / 呼称"></div><div><label>簡易タグ（任意）</label><input id="charTags" placeholder="例：OC、制服、猫耳"></div></div>
<label>キャラクター設定 / 固定プロンプト</label><textarea id="charPrompt" placeholder="キャラ固有の容姿、髪、目、体型、属性など"></textarea>
<div class="row"><button class="primary" id="addChar">登録 / 更新</button><button id="clearChar">入力をクリア</button><button id="exportChars">登録キャラを書き出す</button><button id="importChars">読み込み</button><input type="file" id="charFile" accept=".json,application/json" hidden></div>
<div id="charLibrary"></div><p class="note">登録データはこのブラウザ内に保存されます（localStorage）。ブラウザのデータ消去で消える場合があります。JSONバックアップを推奨。</p></section>
<section class="panel"><h2>抽選設定</h2><div class="grid">
<div><label>キャラクター</label><select id="charSelect"><option value="">登録キャラなし / 手入力</option></select></div>
<div><label>抽選密度</label><select id="density"><option value="balanced">標準</option><option value="light">軽め</option><option value="rich">盛り盛り</option><option value="chaos">コア・全部盛り</option></select></div>
<div><label>雰囲気</label><select id="mood"><option value="any">指定なし（ランダム）</option><option>かわいい</option><option>綺麗</option><option>セクシー・ファッション</option><option>ダーク</option><option>ホラー・不穏</option><option>ネタ・シュール</option><option>幻想・神秘</option><option>日常</option><option>フェチ・嗜好演出</option></select></div>
<div><label>表現レベル</label><select id="rating"><option value="all">全年齢中心</option><option value="r15">成人キャラ・R15相当まで</option></select></div>
<div><label>抽選数</label><select id="amount"><option>1</option><option>3</option><option>5</option><option>10</option></select></div>
</div><div class="row" style="margin-top:12px"><button class="primary" id="generate">🎲 ランダム呼び出し</button><button id="reroll">↻ 再抽選</button></div></section>
<section class="panel"><h2>抽選結果</h2><div class="chips" id="tags"></div><textarea class="result" id="result" readonly placeholder="抽選結果"></textarea>
<div class="row"><button class="primary" id="copy">結果コピー</button><button id="copyPrompt">キャラ込みプロンプトコピー</button><button id="save">TXT保存</button></div><p id="status" class="stats"></p></section>

<footer>ORACLE · Random prompt tool · local character library · no uploads</footer></main>

function renderChars(){let a=getStore(),box=document.getElementById('charLibrary');box.innerHTML='';let sel=document.getElementById('charSelect');sel.innerHTML='<option value="">登録キャラなし / 手入力</option>';a.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=c.name;sel.appendChild(o);let d=document.createElement('div');d.className='character-card';d.innerHTML=`<b>${esc(c.name)}</b> <small>${esc(c.tags||'')}</small><p class="note">${esc(c.prompt.slice(0,160))}${c.prompt.length>160?'…':''}</p><div class="row"><button data-load="${i}">編集</button><button class="danger" data-del="${i}">削除</button></div>`;box.appendChild(d)});box.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let c=a[+b.dataset.load];document.getElementById('charName').value=c.name;document.getElementById('charTags').value=c.tags;document.getElementById('charPrompt').value=c.prompt;document.getElementById('charSelect').value=b.dataset.load});box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('このキャラクターを削除しますか？')){a.splice(+b.dataset.del,1);setStore(a);renderChars()}})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('addChar').onclick=()=>{let n=document.getElementById('charName').value.trim(),p=document.getElementById('charPrompt').value.trim(),t=document.getElementById('charTags').value.trim();if(!n||!p){alert('名前と設定を入力してください');return}let a=getStore(),idx=document.getElementById('charSelect').value;if(idx!==''&&a[+idx])a[+idx]={name:n,prompt:p,tags:t};else a.push({name:n,prompt:p,tags:t});setStore(a);renderChars();document.getElementById('status').textContent='キャラクターを保存しました（端末内）'};
document.getElementById('clearChar').onclick=()=>{document.getElementById('charName').value='';document.getElementById('charTags').value='';document.getElementById('charPrompt').value='';document.getElementById('charSelect').value=''};
document.getElementById('charSelect').onchange=()=>{let i=document.getElementById('charSelect').value;if(i==='')return;let c=getStore()[+i];if(c){document.getElementById('charName').value=c.name;document.getElementById('charTags').value=c.tags;document.getElementById('charPrompt').value=c.prompt}};
document.getElementById('exportChars').onclick=()=>{let b=new Blob([JSON.stringify(getStore(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oracle-characters.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importChars').onclick=()=>document.getElementById('charFile').click();
document.getElementById('charFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;setStore([...getStore(),...x.filter(c=>c.name&&c.prompt)]);renderChars();alert('読み込みました')}catch{alert('JSON形式を確認してください')}e.target.value=''};
renderChars();
function pick(a){return a[Math.floor(Math.random()*a.length)]}function sample(a,n){let x=[...a],o=[];while(o.length<n&&x.length){o.push(x.splice(Math.floor(Math.random()*x.length),1)[0])}return o}
let last='';
function build(){let density=document.getElementById('density').value,mood=document.getElementById('mood').value,rating=document.getElementById('rating').value,amount=+document.getElementById('amount').value,outputs=[];
for(let i=0;i<amount;i++){let c={};
if(density==='light'){for(let k of ['衣装','ポーズ','表情','構図','背景','小物','光・演出'])c[k]=pick(banks[k]);c['光・演出']=sample(banks['光・演出'],2).join(', ')}
else if(density==='rich'||density==='chaos'){keys.forEach(k=>c[k]=sample(banks[k],density==='chaos'?(k==='光・演出'?4:3):(k==='光・演出'?3:2)).join(', '))}
else{for(let k of ['衣装','ポーズ','表情','構図','背景','小物','光・演出','シチュエーション','画風'])c[k]=pick(banks[k]);c['光・演出']=sample(banks['光・演出'],2).join(', ')}
if(mood!=='any')c['雰囲気']=sample(moodTags[mood],2).join(', ');
if(rating==='r15')c['成人キャラ・R15ムード']=pick(["adult character, non-explicit sensual fashion","adult character, flirtatious styling, fully clothed","adult character, tasteful provocative fashion editorial, no nudity","adult character, suggestive pose with opaque coverage","adult character, fetish-inspired styling, non-explicit"]);
outputs.push(Object.entries(c).map(([k,v])=>`${k}: ${v}`).join('\n'))}
last=outputs.join('\n\n===== RANDOM SET =====\n\n');document.getElementById('result').value=last;document.getElementById('tags').innerHTML=keys.map(k=>`<span class="chip">${k}</span>`).join('');document.getElementById('status').textContent=`${amount}件抽選 · ${sum}個の単独候補から組み合わせ · キャラ欄は抽選外`}
document.getElementById('generate').onclick=build;document.getElementById('reroll').onclick=build;
function promptAll(){let selected=document.getElementById('charSelect').value,character='';if(selected!==''){let c=getStore()[+selected];if(c)character=`Character: ${c.name}\n${c.prompt}\n\n`}else{character=document.getElementById('charPrompt').value.trim();if(character)character=character+'\n\n'}return character+last}
document.getElementById('copy').onclick=async()=>{if(!last)return;await navigator.clipboard.writeText(last);document.getElementById('status').textContent='抽選結果をコピーしました'};
document.getElementById('copyPrompt').onclick=async()=>{if(!last)return;await navigator.clipboard.writeText(promptAll());document.getElementById('status').textContent='キャラクター設定込みでコピーしました'};
document.getElementById('save').onclick=()=>{if(!last)return;let b=new Blob([promptAll()],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oracle-random-scene.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
